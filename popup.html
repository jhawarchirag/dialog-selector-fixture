<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popup</title>
<style>body { font-family: sans-serif; margin: 24px; }</style>
</head>
<body>
<h1>Popup</h1>
<p id="status">Confirming...</p>
<button id="confirm" data-test-id="popup-confirm">Confirm</button>
<script>
  // Without ?stay=1 the page closes itself after Confirm, like a payment or auth popup.
  const stay = new URLSearchParams(location.search).has('stay');
  document.getElementById('status').textContent = stay ? 'Close this tab yourself.' : 'Click Confirm; this tab then closes itself.';
  document.getElementById('confirm').addEventListener('click', () => {
    document.getElementById('status').textContent = 'Confirmed';
    if (!stay) setTimeout(() => window.close(), 500);
  });
</script>
</body>
</html>
