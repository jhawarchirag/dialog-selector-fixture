<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Fixture</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  dialog { padding: 24px; border: 1px solid #888; }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
</style>
</head>
<body>
<div id="app">
  <h1>Cart</h1>
  <button id="checkout" data-test-id="checkout-button">Checkout</button>
  <p id="done" hidden>Order complete</p>
  <!-- Decoy: makes `dialog` / `.preflight` non-unique so the recorder falls back to a positional css path. -->
  <dialog class="preflight"></dialog>
</div>
<script>
  // Mirrors LTAR-449: dialog id regenerated per render, portaled under <body> at a varying index.
  const randomId = () => 'modal-' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);

  // Portaled nodes carry no class or id, so the recorder can only locate the wrapper by position.
  let portaled = [];

  function addNoiseDivs() {
    const count = Math.floor(Math.random() * 5) + 1;
    for (let i = 0; i < count; i++) {
      portaled.push(document.body.appendChild(document.createElement('div')));
    }
  }

  function openDialog() {
    portaled.forEach((el) => el.remove());
    portaled = [];
    addNoiseDivs();

    const wrapper = document.createElement('div');
    portaled.push(wrapper);
    wrapper.innerHTML = `
      <dialog id="${randomId()}" class="preflight" aria-label="Summary of your purchase dialog">
        <h2>Tickets Summary</h2>
        <p>1 ticket, $2.00</p>
        <button data-test-id="wc-checkout-complete-button">Complete</button>
      </dialog>`;
    document.body.appendChild(wrapper);

    const dialog = wrapper.querySelector('dialog');
    dialog.querySelector('button').addEventListener('click', () => {
      dialog.close();
      wrapper.remove();
      document.getElementById('done').hidden = false;
    });
    dialog.showModal();
  }

  document.getElementById('checkout').addEventListener('click', openDialog);
</script>
</body>
</html>
